  theme:
    mode: "interactive_auto"
    support: "dual"
    default: "system"
    visibleOverride: true
    exception: {}
  motion:
    intensity: "guided"
    patterns:
      - "grouped once-only entrance reveals with 32 px vertical or 36 px directional travel, 760/920 ms opacity/settle timing, and 150 ms stagger capped at 450 ms"
      - "r7 prominent/calm navbar transition over 560 ms; the whole row scales to 50% for a 29/27 px calm state, and a transparent wake layer forwards one-tap activation through virtual 44 px targets while restoring full-size controls; upward scroll, header intent or menu open also restore the prominent state"
      - "real navbar CTA capsule with one aria-hidden 3.7-second sweep and 1.09-second flick overlay; finite once with no replay or loop"
      - "the hero photograph is position-static while prominent landometer.logo.full animates over it for 2.87 seconds once with an exact SVG fallback; the remaining 10 section placements use only verified full-colour layers, rings, dial, cultivate and slice families with blue ink; every carrier is transparent"
      - "the owner-approved CityChat animated light identity combines its exact base PNG with the observed overlay SVG on a transparent brand-row carrier, starts at at least 14% visibility, completes once and does not replay"
      - "the ijji r3 mark-only sting is 64 × 64 px on a transparent brand-row carrier by artifact-local owner overrides, starts only after at least 14% visibility and all nine layers load/decode, continues for 6.4 seconds, retains the exact still until ready/failure, and does not replay; package minimum guidance remains unchanged"
      - "bounded requestAnimationFrame parallax applies only to substantial static content imagery in pillar, Location Intelligence, eligible product, tailored-service and CityMETER showcase frames; hero media, motif stages, identity, provider surfaces, video and testimonial marks are excluded"
      - "one localized page control pauses and resumes first-party CSS/JavaScript motion, the ijji timeline, scroll-linked movement and the Living video without persisting a motion preference"
      - "Downbeat press for action controls"
      - "One-drop settle for copy feedback"
      - "Story disclosure stages two narrative paragraphs over 820 ms with 80/260 ms delays, followed by a four-beat 480 ms rally"
      - "TikTok-first editorial social grid lazily loads actual TikTok, Facebook, Instagram and LinkedIn provider surfaces near the viewport in both themes; DS-owned shells follow the selected theme while provider internals retain provider styling"
      - "Location Intelligence and testimonials each retain six semantic source cards and add one sanitized aria-hidden inert six-card clone cycle at the head and tail; both auto-advance, pause for hover/focus/pointer/touch/wheel or global/reduced motion, and retain bidirectional pointer, touch and keyboard movement with logical-card preservation after resize"
      - "all six localized Location CTA captions use shortened one-line labels with max-width, nowrap and responsive padding/type; primary conversation and submit CTAs add a finite solid-yellow underline sweep to governed outline geometry while contextual surface/foreground pairs preserve contrast"
      - "local TH/EN layout checks at 320, 360, 390, 600, 601, 630, 640, 700, 768, 900, 1080, 1081, 1280 and 1440 px found no CTA or page overflow; twelve captions per case remained opaque flow siblings outside transformed images; Thai names broke only between tokens; product marks, mobile CityMETER preview, header and centered Thailand maps passed"
      - "the Living r3 portrait video uses nine variable-speed sections from 0.68× to 1.45× for a warm playful rhythm, remains silent/muted/viewport-gated/looping, and freezes to its poster under reduced motion"
      - "dark-theme menu, utility, menu-toggle and topic-option hover/focus states use a stronger 34% accent mix on the raised surface while selected states use 16%; local computed hover changed from transparent to color(srgb .244784 .393333 .443686) with light text"
    omitted:
      - "Offbeat count-up is absent because the null legacy-system row is not rendered."
      - "No hue cycling, hero pan, hero parallax or scroll jacking."
      - "Owner-directed Living video is the only continuous autoplay/loop exception; reduced motion retains the poster and the visible page control pauses it."
      - "Reduced motion keeps the navbar prominent, suppresses the finite CTA sweep, freezes static-content parallax and presents complete motif fallbacks/final states."
